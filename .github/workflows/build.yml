name: Build and Deploy Flatpak

on:
  push:
    branches:
      - main
      - dev
    tags: [ '*' ]
    # paths-ignore:
    #   - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl python3-pip
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --runtime runtime/org.kde.Sdk/x86_64/6.10

      - name: Clone external repositories
        run: |
          git clone https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools
          git clone https://github.com/marcinz606/NegPy.git /tmp/NegPy

      - name: Prepare Python files for offline use
        run: |
          sed -i 's/requires = \["setuptools/requires = \["meson-python>=0.19.0","setuptools/g' /tmp/NegPy/pyproject.toml
          pip install --user requirements-parser pyyaml
          FLATPAK_PIP_GENERATOR_ALLOW_RESTRICTED_MODULES=1 /tmp/flatpak-builder-tools/pip/flatpak-pip-generator --runtime org.kde.Sdk//6.10 --pyproject-file /tmp/NegPy/pyproject.toml --prefer-wheels=opencv-python-headless,pyqt6-charts-qt6,pyqt6-qt6,rawpy -o $GITHUB_WORKSPACE/pip-generated.yaml --yaml --cleanup all

      - name: Build Flatpak
        run: >
          flatpak-builder --force-clean --sandbox --user
          --install-deps-from=flathub --repo=./repo --install
          build com.marcinz606.NegPy.yml

      - name: Build Flatpak bundle
        run: |
          mkdir -p release
          flatpak build-bundle -vv ./repo ./release/com.marcinz606.NegPy.flatpak com.marcinz606.NegPy

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.marcinz606.NegPy.flatpak
          path: release/com.marcinz606.NegPy.flatpak
