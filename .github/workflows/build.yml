name: Build and Deploy Flatpak

on:
  push:
    branches:
      - main
      - dev
    tags: [ '*' ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx yq python3-packaging
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Set up Poetry
        run: pipx install poetry

      - name: Clone external repositories
        run: |
          git clone https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools
          git clone --branch $(cat flatpak.yml | yq -r '.modules.[] | select(.name=="NegPy").sources.[0].tag') https://github.com/marcinz606/NegPy.git /tmp/NegPy

      - name: Generate Python modules
        run: python3 tools/flatpak-uv-generator.py /tmp/NegPy/uv.lock -o generated/python3-modules.json

      - name: Generate cargo sources for negpy_core
        run: |
          mkdir -p cargo-sources/negpy-core
          cd /tmp/flatpak-builder-tools/cargo
          poetry install
          poetry run python3 flatpak-cargo-generator.py \
            /tmp/NegPy/negpy_core/Cargo.lock \
            -o $GITHUB_WORKSPACE/cargo-sources/negpy-core/negpy-core.cargo-sources.json

      - name: Build Flatpak
        run: >
          flatpak-builder --arch=x86_64 --force-clean --sandbox --user
          --install-deps-from=flathub --repo=./repo --install
          build flatpak.yml

      - name: Build Flatpak bundle
        run: |
          mkdir -p release
          flatpak build-bundle -vv --arch=x86_64 ./repo ./release/com.marcinz606.NegPy.flatpak com.marcinz606.NegPy

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.marcinz606.NegPy.flatpak
          path: release/com.marcinz606.NegPy.flatpak

  deploy:
    name: Deploy and Sign Flatpak
    needs: build
    # Restrict deployment to merges/pushes to main, tag creation, or manual triggers
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak

      - name: Download Flatpak bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: com.marcinz606.NegPy.flatpak
          path: release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/com.marcinz606.NegPy.flatpak

      - name: Checkout flatpaks repository
        uses: actions/checkout@v4
        with:
          repository: imjuzcy/flatpaks
          token: ${{ secrets.FLATPAKS_REPO_TOKEN }}
          path: flatpaks-repo

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Import bundle and sign repository
        run: |
          cd flatpaks-repo
          flatpak build-import-bundle --gpg-sign="${{ secrets.GPG_KEY_ID }}" repo ../release/com.marcinz606.NegPy.flatpak
          flatpak build-update-repo --generate-static-deltas --gpg-sign="${{ secrets.GPG_KEY_ID }}" repo

      - name: Commit and push to flatpaks
        run: |
          cd flatpaks-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          git commit -m "Update and sign com.marcinz606.NegPy Flatpak" || echo "No changes to commit"
          git push
