name: Build and Deploy Flatpak

on:
  push:
    branches:
      - main
      - dev
    tags: [ '*' ]
    paths-ignore:
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder curl
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --runtime runtime/org.kde.Platform/x86_64/6.10
          
      - name: Clone external repositories
        run: |
          git clone https://github.com/flatpak/flatpak-builder-tools.git /tmp/flatpak-builder-tools
          git clone https://github.com/marcinz606/NegPy.git /tmp/NegPy
      
      - name: Prepare Python files for offline use
        run: |
          pip install --user requirements-parser
          FLATPAK_PIP_GENERATOR_ALLOW_RESTRICTED_MODULES=1 /tmp/flatpak-builder-tools/pip/flatpak-pip-generator --runtime org.kde.Platform//6.10 --pyproject-file /tmp/NegPy/pyproject.toml -o $GITHUB_WORKSPACE/pip-generated.yml --yaml --cleanup all
          ls $GITHUB_WORKSPACE/pip-generated.yml

      - name: Build Flatpak
        run: >
          flatpak-builder --force-clean --sandbox --user
          --install-deps-from=flathub --repo=./repo --install
          build com.marcinz606.NegPy.yml

      - name: Build Flatpak bundle
        run: |
          mkdir -p release
          flatpak build-bundle -vv ./repo ./release/com.marcinz606.NegPy.flatpak com.marcinz606.NegPy

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.marcinz606.NegPy.flatpak
          path: release/com.marcinz606.NegPy.flatpak
