name: Check Upstream for Updates

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stub manifests
        run: |
          mkdir -p generated cargo-sources/negpy-core
          cat << 'EOF' > generated/python3-modules.json
          {"name": "python3-modules", "buildsystem": "simple", "build-commands": []}
          EOF
          cat << 'EOF' > cargo-sources/negpy-core/negpy-core.cargo-sources.json
          []
          EOF

      - name: Run flatpak-external-data-checker (Edit Only)
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --edit-only flatpak.yml
        continue-on-error: true

      - name: Branch, Commit, and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are actually updates to NegPy
          if cmp --silent <(git show HEAD:flatpak.yml | yq '.modules[] | objects | select(.name=="NegPy") | .sources[] | objects | select(.type=="git" and (.url | test("marcinz606/NegPy")))') \
                          <(yq '.modules[] | objects | select(.name=="NegPy") | .sources[] | objects | select(.type=="git" and (.url | test("marcinz606/NegPy")))' flatpak.yml); then
            echo "No updates to NegPy found. Exiting."
            exit 0
          fi

          VERSION_TAG=$(yq -r '.modules[] | objects | select(.name=="NegPy") | .sources[] | objects | select(.type=="git" and (.url | test("marcinz606/NegPy"))) | .tag' flatpak.yml)
          BRANCH_NAME="negpy-${VERSION_TAG}"

          BRANCH_EXISTS=$(git ls-remote --heads origin "$BRANCH_NAME")
          if [ -n "$BRANCH_EXISTS" ]; then
            echo "Branch '$BRANCH_NAME' already exists on remote. A PR is likely already open. Exiting."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y xmlstarlet
          xmlstarlet ed -L -u 'component/releases/release/@version' -v ${VERSION_TAG} -u 'component/releases/release/@date' -v $(date +%Y-%m-%d) extra/com.marcinz606.NegPy.metainfo.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add flatpak.yml extra/com.marcinz606.NegPy.metainfo.xml
          git commit -m "Update NegPy to ${VERSION_TAG}"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "Update NegPy to ${VERSION_TAG}" \
            --body "Automated update generated by flatpak-external-data-checker. Please review the build checks." \
            --base main \
            --head "$BRANCH_NAME"

          gh workflow run build.yml --ref "$BRANCH_NAME"
