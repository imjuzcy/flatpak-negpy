id: com.marcinz606.NegPy
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: negpy-wrapper
add-extensions:
  org.freedesktop.Platform.VAAPI.Intel:
    directory: lib/intel-vaapi-driver
    version: '25.08'
    autodelete: false
    no-autodownload: true
  org.freedesktop.Platform.GL:
    directory: lib/GL
    version: '25.08'
    versions: 25.08;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=system-bus
  - --share=network
  - --share=ipc
  - --device=all
  - --talk-name=org.freedesktop.ScreenSaver
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - /share/man
  - /share/pkgconfig
  - '*.a'
  - '*.la'
modules:
  - name: libusb1
    sources:
    - type: archive
      url: https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2
      sha256: 5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85
      x-checker-data:
        type: anitya
        project-id: 1749
        stable-only: true
        url-template: https://github.com/libusb/libusb/releases/download/v$version/libusb-$version.tar.bz2
  - name: sane
    buildsystem: autotools
    config-opts:
    - "--with-usb"
    - "--with-v4l"
    - "--with-gphoto2"
    - "--enable-pthread"
    - "--enable-pnm-backend"
    - "--enable-pthread"
    - "--enable-avahi"
    sources:
    - type: git
      url: https://gitlab.com/sane-project/backends
      tag: 1.4.0
      x-checker-data:
        type: git
        tag-pattern: "^([\\d.]+)$"
      commit: c7e4b5e35e3d614d2b1181d760a717bfc395a203
  - name: python3-build-tools-meson-python
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "meson-python>=0.19.0" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5e/cd/f3a881ff5e601d6bbeff63b38ee2362e1167c47d9cde03eddf8d71a4ffb0/meson-1.11.1-py3-none-any.whl
        sha256: 9b3a023657e393dbc5335b95c561337d49b7a458f5541e47ec44f2cc566e0d80
      - type: file
        url: https://files.pythonhosted.org/packages/16/7f/d1b0c65b267a1463d752b324f11d3470e30889daefc4b9ec83029bfa30b5/meson_python-0.19.0-py3-none-any.whl
        sha256: 67b5906c37404396d23c195e12c8825506074460d4a2e7083266b845d14f0298
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
      - type: file
        url: https://files.pythonhosted.org/packages/1d/0b/da4851b1e2d9c40c9bd74c0abd94510a7d797da9ccde0a90e8953751ed4a/pyproject_metadata-0.11.0-py3-none-any.whl
        sha256: 85bbecca8694e2c00f63b492c96921d6c228454057c88e7c352b2077fcaa4096
    cleanup:
      - '*'
  - name: python3-build-tools-setuptools
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "setuptools~=80.10.2" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/94/b8/f1f62a5e3c0ad2ff1d189590bfa4c46b4f3b6e49cef6f26c6ee4e575394d/setuptools-80.10.2-py3-none-any.whl
        sha256: 95b30ddfb717250edb492926c92b5221f7ef3fbcc2b07579bcd4a27da21d0173
    cleanup:
      - '*'
  - name: libdeflate
    buildsystem: meson
    config-opts:
      - -Dlibdeflate_build_static=disabled
      - -Dbuild_examples=disabled
      - -Dbuild_tests=disabled
    sources:
      - type: archive
        url: https://github.com/ebiggers/libdeflate/archive/refs/tags/v1.14.tar.gz
        sha256: 3eab7e2e160e228d6fe59d0898f63e186c565aa37ac25883ef110b9cd2ba7ec6
  - pip-generated.yaml
  - name: NegPy
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/intel-vaapi-driver
      - mkdir -p /app/lib/GL
      - mkdir -p /app/bin
      - mv uv-x86_64-unknown-linux-gnu/* -t /app/bin/
      - rmdir uv-x86_64-unknown-linux-gnu
      - mkdir -p /app/opt/negpy
      - cp -r * -t /app/opt/negpy/
      - cd /app/opt/negpy/
      - uv sync --offline
      - install -Dm644 negpy.desktop /app/share/applications/com.marcinz606.NegPy.desktop
      - install -Dm644 com.marcinz606.NegPy.metainfo.xml /app/share/metainfo/com.marcinz606.NegPy.metainfo.xml
      - install -Dm644 media/icons/icon.svg /app/share/icons/hicolor/scalable/apps/com.marcinz606.NegPy.svg
      - sed -i 's/Icon=icon/Icon=com.marcinz606.NegPy/g' /app/share/applications/com.marcinz606.NegPy.desktop
      - sed -i 's/Exec=NegPy/Exec=negpy-wrapper/g' /app/share/applications/com.marcinz606.NegPy.desktop
      - |
        cat > /app/bin/negpy-wrapper << EOF
        #!/bin/bash
        cd /app/opt/negpy
        exec python3 desktop.py "$@"
        EOF
      - chmod +x /app/bin/negpy-wrapper
    sources:
      - type: git
        url: https://github.com/marcinz606/NegPy.git
        tag: 0.21.0
        commit: 8d14d2e1afc3fc5b741bd262791ca08ba0c0ac00
        x-checker-data:
          type: git
          tag-pattern: ^([\d]+\.[\d]+\.[\d]+)$
      - type: dir
        path: ./extra/
